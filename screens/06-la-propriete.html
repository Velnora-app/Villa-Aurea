<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>html{background:#141311}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Velnora — Villa Aurea — La Villa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,400&display=swap">
<link rel="stylesheet" href="../css/velnora-shared.css">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="icon" href="../assets/favicon-32.png">
<meta name="theme-color" content="#141311">
<style>
  .device{background:var(--ink);}
  .cover{position:relative;height:340px;overflow:hidden;background:#221c17;}
  .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(180deg, rgba(20,19,17,0), var(--ink) 96%);pointer-events:none;}

  .narrative{font-family:var(--font-editorial);font-size:17px;font-weight:400;line-height:1.75;color:var(--paper-2);padding:26px var(--space-5) 4px;max-width:640px;margin:0 auto;}

  .location-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;max-width:640px;margin:16px auto 22px;}
  .location-row .li-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .location-txt{font-family:var(--font-body);font-size:13px;font-weight:300;color:var(--stone-dim);}
  .location-txt b{color:var(--paper-2);font-weight:400;}

  .strong-photos{display:flex;gap:12px;overflow-x:auto;padding:0 var(--space-5) 40px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;max-width:640px;margin:0 auto;}
  .strong-photos::-webkit-scrollbar{display:none;}
  .strong-photo{min-width:64%;scroll-snap-align:start;flex-shrink:0;}
  .strong-photo .img-wrap{height:180px;border-radius:2px;}
  .strong-photo .cap{font-family:var(--font-display);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--stone-dim);margin-top:9px;}
</style>
</head>
<body>

<div class="device">
  <div class="scroll-area" id="scroll">
    <div class="back-affordance" id="back" onclick="location.href='01-accueil.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5 L8 12 L15 19"/></svg>Accueil</div>

    <div class="cover">
      <picture>
        <source type="image/webp" srcset="../assets/images/hero-exterieur-900.webp 900w, ../assets/images/hero-exterieur-1600.webp 1600w" sizes="(min-width:720px) 480px, 100vw">
        <img src="../assets/images/hero-exterieur-900.jpg" srcset="../assets/images/hero-exterieur-900.jpg 900w, ../assets/images/hero-exterieur-1600.jpg 1600w" sizes="(min-width:720px) 480px, 100vw" alt="La Villa Aurea et sa piscine à l'heure bleue" loading="eager" decoding="async" fetchpriority="high">
      </picture>
    </div>

    <div class="page-col">
      <div class="narrative enter">Perchée face à l'horizon, la Villa Aurea ouvre chacune de ses pièces sur la mer. Un lieu pensé pour les journées longues au bord de l'eau et les soirées qui s'étirent sous la pergola, entre pierre claire et lumière du soir.</div>

      <div class="location-row glass-group enter enter-1">
        <div class="li-left">
          <span class="glass-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/></svg></span>
          <div class="location-txt">Hyères, <b>France</b></div>
        </div>
        <a class="vln-btn vln-btn-ghost" href="https://www.google.com/maps/search/?api=1&query=43.0388%2C6.1305" onclick="event.preventDefault(); openInMaps(43.0388, 6.1305, 'Villa Aurea, Hyères');">Voir sur la carte</a>
      </div>

      <div class="strong-photos enter enter-2">
        <div class="strong-photo">
          <div class="img-wrap"><picture><source type="image/webp" srcset="../assets/images/g04-piscine-900.webp"><img class="img-fill" src="../assets/images/g04-piscine-900.jpg" alt="Vue aérienne de la piscine et de la villa au crépuscule" loading="lazy" decoding="async"></picture></div>
          <div class="cap">Piscine</div>
        </div>
        <div class="strong-photo">
          <div class="img-wrap"><picture><source type="image/webp" srcset="../assets/images/g03-terrasse-900.webp"><img class="img-fill" src="../assets/images/g03-terrasse-900.jpg" alt="Terrasse couverte et salle à manger extérieure vues d'en haut" loading="lazy" decoding="async"></picture></div>
          <div class="cap">Terrasse</div>
        </div>
        <div class="strong-photo">
          <div class="img-wrap"><picture><source type="image/webp" srcset="../assets/images/g02-vue-mer-900.webp"><img class="img-fill" src="../assets/images/g02-vue-mer-900.jpg" alt="Vue sur la mer et les îles depuis la Villa Aurea" loading="lazy" decoding="async"></picture></div>
          <div class="cap">Vue mer</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../js/velnora-shared.js"></script>
<script>
  initAssistant();
  initBackAffordance();
</script>

</body>
</html>
