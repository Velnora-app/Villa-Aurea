<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>html{background:#211c17}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Velnora — Villa Aurea — Conciergerie</title>
<link rel="stylesheet" href="../css/velnora-shared.css">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="icon" href="../assets/favicon-32.png">
<meta name="theme-color" content="#211c17">
<style>
  .device{background:radial-gradient(120% 70% at 50% -10%, #211c17 0%, var(--ink) 55%);}
  .contact-row{display:flex;align-items:center;gap:13px;padding:15px 16px;cursor:pointer;}
  .contact-row + .contact-row{border-top:1px solid rgba(239,236,229,.07);}
  .contact-row .txt{flex:1;min-width:0;}
  .contact-row .nm{font-family:var(--font-body);font-size:15px;font-weight:400;color:var(--paper);}
  .contact-row .av{font-family:var(--font-body);font-size:11.5px;font-weight:300;color:var(--stone-dim);margin-top:3px;}
  .contact-row .call{width:32px;height:32px;border-radius:50%;border:1px solid rgba(239,236,229,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background-color var(--duration-micro) var(--ease-signature), border-color var(--duration-micro) var(--ease-signature);}
  .contact-row .call svg{width:13px;height:13px;color:var(--paper);}
  .contact-row:active .call{background:var(--brass-light);border-color:var(--brass-light);}
  .contact-row:active .call svg{color:var(--ink);}
  .contact-row:active{transform:scale(.985);transition:transform 110ms var(--ease-signature);}
  @media (hover:hover) and (pointer:fine){ .contact-row:active{transform:none;} }
  .emergency-row{display:flex;align-items:center;gap:13px;padding:14px 16px;font-family:var(--font-body);font-size:14.5px;font-weight:400;color:var(--paper);cursor:pointer;}
  .emergency-row + .emergency-row{border-top:1px solid rgba(239,236,229,.07);}
  .emergency-row .txt{flex:1;min-width:0;}
  .emergency-row .num{font-family:var(--font-display);font-weight:500;color:var(--brass-light);font-variant-numeric:tabular-nums;}
</style>
</head>
<body>

<div class="device">
  <div class="scroll-area" id="scroll">
    <div class="back-affordance" id="back" onclick="location.href='01-accueil.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5 L8 12 L15 19"/></svg>Accueil</div>

    <div class="page-head">
      <div class="page-col">
        <div class="screen-eyebrow enter">Velnora · Villa Aurea</div>
        <h1 class="screen-title enter enter-1">Conciergerie</h1>

        <div class="glass-group-label enter enter-2">Votre conciergerie</div>
        <div class="glass-group enter enter-2">
          <a class="contact-row" href="tel:+33450551237" style="text-decoration:none;">
            <div class="glass-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.68 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0 1 22 16.92z"/></svg></div>
            <div class="txt"><div class="nm">Conciergerie Aurea</div></div>
            <div class="call"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.68 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0 1 22 16.92z"/></svg></div>
          </a>
          <a class="contact-row" href="tel:+33647821590" style="text-decoration:none;">
            <div class="glass-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></div>
            <div class="txt"><div class="nm">Stéphane</div><div class="av">Disponible en journée</div></div>
            <div class="call"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.68 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0 1 22 16.92z"/></svg></div>
          </a>
        </div>

        <div class="glass-group-label enter enter-4">Numéros d'urgence</div>
        <div class="glass-group enter enter-4">
          <a class="emergency-row" href="tel:112" style="text-decoration:none;">
            <div class="glass-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
            <div class="txt">Urgence européenne</div><span class="num">112</span>
          </a>
          <a class="emergency-row" href="tel:15" style="text-decoration:none;">
            <div class="glass-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 8.5V6a2 2 0 0 0-2-2H9L6 7v11a2 2 0 0 0 2 2h3M14 14l3 3 5-6"/></svg></div>
            <div class="txt">SAMU</div><span class="num">15</span>

          <a class="emergency-row" href="tel:17" style="text-decoration:none;">
            <div class="glass-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg></div>

</div>

</html>
